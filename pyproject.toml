[project]
name = "chatupai"
version = "0.1.0"
description = "ChatUpAI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic>=2.14.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
chatupai = "chatupai:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
