[project]
name = "chatupai"
version = "0.1.0"
description = "ChatUpAI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "langchain-core>=1.8.5",
    "langchain-openai>=1.8.5",
    "langgraph>=1.2.24",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
chatupai = "api.main:run"

